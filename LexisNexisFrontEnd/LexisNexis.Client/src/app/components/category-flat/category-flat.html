<table
  mat-table
  [dataSource]="(categories$ | async) ?? []"
  class="mat-elevation-z1 full-width"
>

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let category">{{ category.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let category">{{ category.name }}</td>
  </ng-container>

  <!-- Description Column -->
  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef>Description</th>
    <td mat-cell *matCellDef="let category">
      {{ category.description || '—' }}
    </td>
  </ng-container>

  <!-- Parent Category Column -->
  <ng-container matColumnDef="parentCategoryId">
    <th mat-header-cell *matHeaderCellDef>Parent Category</th>
    <td mat-cell *matCellDef="let category">
      {{ getCategoryName(category.parentCategoryId) || 'Root' }}
    </td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let category">

      <!-- Delete -->
      <button
        mat-icon-button
        color="warn"
        (click)="deleteCategory(category)"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <!-- Header and Row Declarations -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
