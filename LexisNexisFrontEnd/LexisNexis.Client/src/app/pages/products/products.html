<div class="search-container" style="display: flex; gap: 16px; margin-bottom: 16px; align-items: stretch;">
  <!-- Category filter -->
  <app-category-filter
    (categorySelected)="onCategoryFilterChanged($event)"
    style="flex: 0 0 auto; display: flex; align-items: stretch;"
  ></app-category-filter>

  <!-- Search input -->
  <mat-form-field appearance="outline" style="flex: 1;">
    <mat-label>Search products</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Enter product name" />
  </mat-form-field>

  <!-- Search button -->
  <button
    mat-raised-button
    color="primary"
    (click)="onSearch()"
    style="height: 100%; min-height: 56px;"
  >
    Search
  </button>
</div>



<!-- Products list -->
<mat-list>
  <mat-list-item *ngFor="let product of products$ | async">
    <div style="display: flex; justify-content: space-between; width: 100%;">
      <span>{{ product.name }}</span>
      <span>{{ product.price | currency }}</span>
    </div>
  </mat-list-item>
</mat-list>
